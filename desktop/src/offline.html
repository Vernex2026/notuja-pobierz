<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Notuja</title>
    <style>
      body { margin: 0; height: 100vh; display: grid; place-items: center; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; background: #f6f7fb; color: #1b2033; }
      main { max-width: 380px; text-align: center; padding: 24px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: #5b6275; }
      a { display: inline-block; padding: 10px 18px; border-radius: 10px; background: #2f52d6; color: #fff; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Brak połączenia z Notują</h1>
      <p>Sprawdź internet i spróbuj ponownie.</p>
      <a id="retry" href="#">Spróbuj ponownie</a>
    </main>
    <script>
      const target = new URLSearchParams(location.search).get('u');
      if (target && /^https?:\/\//.test(target)) document.getElementById('retry').href = target;
    </script>
  </body>
</html>
